<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - Comercial Estuardo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Comercial Estuardo</h1>
        <p>Sesión: {{ session.get('user_name', '') }}</p>
    </header>

    <main class="product-form-page">
        <h2>{{ titulo }}</h2>

        {% if errores %}
        <div class="alert-danger" role="alert">
            <ul>
                {% for error in errores %}<li>{{ error }}</li>{% endfor %}
            </ul>
        </div>
        {% endif %}

        <form method="POST" class="product-form">
            <div class="form-group">
                <label for="codigo_barra">Código de barras (opcional)</label>
                <input id="codigo_barra" name="codigo_barra" maxlength="50"
                       value="{{ producto.codigo_barra or '' if producto else '' }}">
            </div>
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" maxlength="150" required
                       value="{{ producto.nombre if producto else '' }}">
            </div>
            <div class="form-group">
                <label for="descripcion">Descripción (opcional)</label>
                <textarea id="descripcion" name="descripcion" rows="3">{{ producto.descripcion or '' if producto else '' }}</textarea>
            </div>
            <div class="form-group">
                <label for="precio_costo">Precio de costo (Q)</label>
                <input id="precio_costo" name="precio_costo" type="number" min="0" step="0.01" required
                       value="{{ producto.precio_costo if producto else '0.00' }}">
            </div>
            <div class="form-group">
                <label for="precio_venta">Precio de venta (Q)</label>
                <input id="precio_venta" name="precio_venta" type="number" min="0.01" step="0.01" required
                       value="{{ producto.precio_venta if producto else '' }}">
            </div>
            <div class="form-group">
                <label for="stock_actual">Stock actual</label>
                <input id="stock_actual" name="stock_actual" type="number" min="0" step="1" required
                       value="{{ producto.stock_actual if producto else 0 }}">
            </div>
            <div class="form-group">
                <label for="stock_minimo">Stock mínimo</label>
                <input id="stock_minimo" name="stock_minimo" type="number" min="0" step="1" required
                       value="{{ producto.stock_minimo if producto else 1 }}">
            </div>
            <div class="form-group">
                <label for="id_categoria">Categoría</label>
                <select id="id_categoria" name="id_categoria" required>
                    <option value="">Selecciona una categoría</option>
                    {% for c in categorias %}
                    <option value="{{ c.id_categoria }}"
                        {% if producto and producto.id_categoria == c.id_categoria %}selected{% endif %}>
                        {{ c.nombre }}
                    </option>
                    {% endfor %}
                </select>
                {% if not categorias %}<small>No hay categorías activas disponibles.</small>{% endif %}
            </div>
            <button type="submit" class="btn-submit">Guardar</button>
            <a href="{{ url_for('productos') }}" class="btn">Cancelar</a>
        </form>
    </main>
</body>
</html>
