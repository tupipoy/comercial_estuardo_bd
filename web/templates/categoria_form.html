<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ titulo }} - Comercial Estuardo</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="navbar"><div class="nav-brand"><h1>Comercial Estuardo</h1><p>{{ titulo }}</p></div><div class="nav-user"><span>{{ session.get('user_name', '') }}</span><form method="POST" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit">Cerrar sesión</button></form></div></header>
<main class="product-form-page"><h2>{{ titulo }}</h2>
{% if errores %}<div class="alert-danger" role="alert"><ul>{% for error in errores %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}
<form method="POST" class="product-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-group"><label for="nombre">Nombre</label><input id="nombre" name="nombre" maxlength="100" required value="{{ categoria.nombre }}"></div>
<div class="form-group"><label for="descripcion">Descripción</label><textarea id="descripcion" name="descripcion" maxlength="255" rows="3">{{ categoria.descripcion or '' }}</textarea></div>
<button type="submit" class="btn-submit">Guardar</button><a href="{{ url_for('categorias') }}" class="btn">Cancelar</a></form></main></body></html>
